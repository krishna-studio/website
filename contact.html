<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · Krishna Studio</title>
<meta name="description" content="Get in touch with Krishna Studio.">
<meta name="theme-color" content="#6965db"><meta property="og:title" content="Contact · Krishna Studio"><meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<div class="wrap page-head"><h1>Say hello</h1><p>Have a project in mind, a question or an idea? Send us a note and one of us will reply.</p></div>
<section style="padding-top:2rem"><div class="wrap"><div class="grid">
<article class="card sketch p"><span class="ico" aria-hidden="true">✉️</span><h3>Email</h3><p class="mail"><a href="mailto:hello@krishna-studio.example">hello@krishna-studio.example</a></p><p style="margin-top:.8rem">We usually reply within a few days.</p></article>
<article class="card sketch b"><h3>Write to us</h3><form id="mailform"><label for="n">Your name</label><input class="field" id="n" name="name" required autocomplete="name"><label for="m">Message</label><textarea class="field" id="m" name="msg" required></textarea><button class="btn" type="submit">Open in my email app</button></form></article>
</div></div></section>
</main>
<footer id="site-footer"></footer>
<script src="assets/main.js"></script>
</body>
</html>
